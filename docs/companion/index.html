<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Gesture Controller — Gesture Canvas</title>
  <link rel="stylesheet" href="companion.css" />
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>
  <header>
    <strong>Gesture Controller</strong>
    <p id="status">Starting…</p>
  </header>

  <label>
    Session ID (from host extension popup)
    <input id="session-id" type="text" placeholder="abc12xyz" autocomplete="off" />
  </label>

  <label class="advanced">
    Relay WebSocket
    <input id="relay-url" type="text" placeholder="wss://your-relay.example.com/ws" autocomplete="off" />
  </label>

  <video id="webcam" autoplay playsinline muted></video>

  <section class="modes">
    <button type="button" data-mode="off" class="active">Off</button>
    <button type="button" data-mode="pointer">Pointer</button>
    <button type="button" data-mode="write">Write</button>
  </section>

  <section class="tools">
    <button type="button" data-tool="pen" class="active">Pen</button>
    <button type="button" data-tool="arrow">Arrow</button>
    <button type="button" data-tool="box">Box</button>
  </section>

  <p class="hint">
  Join a session hosted on someone's laptop (Chrome extension + relay).
  Each collaborator gets a unique laser color. Index = point/draw · Fist = stop · Peace = undo
  </p>

  <p class="hint"><a href="../">← Back to Gesture Canvas</a> · <a href="../extension/">Extension guide</a></p>

  <script type="module">
    import { initGestureController } from '../lib/gesture-controller.js';
    import { resolveRelayWs, GC_PUBLIC_WS } from '../lib/gc-config.js';

    const statusEl = document.getElementById('status');
    const videoEl = document.getElementById('webcam');
    const sessionInput = document.getElementById('session-id');
    const relayInput = document.getElementById('relay-url');

    const params = new URLSearchParams(location.search);
    if (params.get('session')) sessionInput.value = params.get('session');
    relayInput.value = resolveRelayWs(params, { preferPublic: true }) || GC_PUBLIC_WS || '';

    const ctrl = await initGestureController({
      videoEl,
      statusEl,
      sessionInput,
      searchParams: params,
      wsUrl: relayInput.value.trim() || undefined,
      onSessionId: (id) => {
        if (id) ctrl.connectWs(id);
      },
    });

    relayInput.addEventListener('change', () => {
      const id = sessionInput.value.trim();
      if (id) ctrl.connectWs(id);
    });

    ctrl.bindModeButtons(document.body);
    ctrl.emitMode();

    if (sessionInput.value.trim()) {
      ctrl.connectWs(sessionInput.value.trim());
    }
  </script>
</body>
</html>
